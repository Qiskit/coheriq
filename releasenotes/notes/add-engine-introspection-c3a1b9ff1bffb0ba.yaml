---
features:
  - |
    Added two functions for inspecting the engines of an acceleration domain:
    :func:`~coheriq.available_engines` returns the names of the engines that can
    be enabled for a domain, and :func:`~coheriq.active_engine` returns the name
    of the engine it has resolved to.  Both accept an
    :class:`~coheriq.AccelerationDomain` or the name of one.

    .. code-block:: python

       from coheriq import active_engine, available_engines

       available_engines("mylib")  # ('reference', 'jax-accelerated', 'mpi')
       active_engine("mylib")      # None, until an engine is resolved

    ``available_engines()`` reports engines that have already been registered as
    well as those advertised through the ``coheriq.engines.<domain>`` entry point
    group but not yet imported, because :func:`~coheriq.enable_engine` accepts
    either.  Advertised plugins are deliberately not imported in order to answer
    the question, so a name being listed means that
    :func:`~coheriq.enable_engine` will attempt it, not that it is guaranteed to
    load.

    ``active_engine()`` returns ``None`` while the domain has not resolved an
    engine yet, meaning a different one can still be enabled, and otherwise the
    name of the engine that is active.  ``None`` therefore means "not decided
    yet", while :data:`~coheriq.REFERENCE` means "decided on the reference
    implementation", so a caller can distinguish the window in which it can still
    act from the state in which the decision has already been made.

    Neither function resolves or freezes the domain's implementation, so an
    engine can still be enabled afterwards.  This is a deliberate contrast with
    calling an acceleration candidate: asking what is active never commits the
    domain to an answer.
  - |
    A domain's own implementations are now addressable as an engine named
    :data:`~coheriq.REFERENCE` (the string ``"reference"``).  Every domain has
    this engine; it is the one in effect until another is enabled, and it is the
    root that every other engine for that domain inherits from.

    .. code-block:: python

       import coheriq

       # Pin the reference implementation, regardless of MYLIB_ENGINE.
       coheriq.enable_engine("mylib", coheriq.REFERENCE)

    Enabling it explicitly is worth doing even though it is the default, because
    an explicit call takes precedence over the domain's environment variable.
    Declining to choose and choosing the reference implementation reach the same
    state, but only the latter is immune to being overridden from the
    environment -- which matters when comparing against the reference
    implementation, debugging a suspected engine bug, or pinning known-good
    behavior in a test.

    Pinning the reference implementation is a forward transition into the same
    settled state that a first call would reach, so it does not weaken the
    one-way activation contract: it forecloses the other engines, and it cannot
    undo an engine that is already active.

    Because ``"reference"`` names an engine that every domain owns, it cannot be
    claimed by a third-party engine; :class:`~coheriq.AccelerationEngine` rejects
    it.
