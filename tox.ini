[tox]
minversion = 4.22.0
envlist = py{310,311,312,313,314,315}{,-notebook,-notebook-engine}, lint, coverage, docs, doctest, ragged, ragged-engine
# The spawn envs (py-spawn, coverage-spawn) are deliberately absent: they are the
# Windows path and a cross-check against the --forked defaults, not part of a
# default sweep.  CI names them explicitly.
isolated_build = True

[testenv]
package = wheel
wheel_build_env = .pkg
parallel_show_output = True
dependency_groups =
  test
commands =
  # --forked isolates each test in its own process; the domain/engine registry
  # is process-global and cannot otherwise be reset between tests.
  pytest --forked {posargs}

[testenv:style]
dependency_groups =
  style
commands =
  ruff format --exclude pytest_forked.py src/ docs/ test/
  ruff check --fix --exclude pytest_forked.py src/ docs/ test/
  nbqa ruff --fix docs/

[testenv:lint]
image-tester-commit = 7ae965ccf21c39e5170334ec7f4882756883860a
deps =
  git+https://github.com/Qiskit/documentation.git@{[testenv:lint]image-tester-commit}\#egg=sphinx-alt-text-validator&subdirectory=scripts/image-tester
dependency_groups =
  lint
commands =
  ruff format --check --exclude pytest_forked.py src/ docs/ test/
  ruff check --exclude pytest_forked.py src/ docs/ test/
  ruff check --preview --select CPY001 --exclude "*.ipynb" --exclude pytest_forked.py src/ example/ test/
  nbqa ruff docs/
  mypy src/
  pylint -rn src/
  # Test methods are grouped into classes for organization; they need not use self.
  pylint -rn --disable=no-self-use test/
  sphinx-alt-text-validator -f src
  nbqa pylint -rn docs/
  reno lint

# Spelled out deliberately. Writing this as {,py310-,...}notebook does not work: tox
# expands numeric ranges in a section name before splitting it on braces, so
# "py310-,...,py315-" parses as "py3" plus the range "10-15". That defines junk
# environments (py3notebook, 4notebook, ...) and never defines py310-notebook and
# friends, which then fall through to [testenv] and silently run the unit tests
# instead of the notebooks.
[testenv:{notebook,py310-notebook,py311-notebook,py312-notebook,py313-notebook,py314-notebook,py315-notebook}]
# Runs the notebooks with the pure-Python default backend (no RAGGED_ENGINE set).
dependency_groups =
  nbtest
  notebook-dependencies
commands_pre =
  # Install the example domain and engine packages so their entry point is
  # registered in the environment's metadata and can be discovered at runtime.
  # --no-deps: their declared "coheriq" dependency is not published; coheriq is
  # already present in this environment as the package under test.
  # Note: installing the engine compiles its C++ extension (scikit-build-core +
  # nanobind), so this env requires a C++ toolchain.
  python -I -m pip install --no-deps ./example/domain ./example/engine
commands =
  pytest --nbmake --nbmake-timeout=3000 {posargs} docs/

# Spelled out deliberately, for the reason given above the notebook env.
[testenv:{notebook-engine,py310-notebook-engine,py311-notebook-engine,py312-notebook-engine,py313-notebook-engine,py314-notebook-engine,py315-notebook-engine}]
# Runs the same notebooks against the compiled "fused" engine, activated via the
# environment variable coheriq reads on first use.  Proves the notebooks run
# identically under either backend.
setenv =
  RAGGED_ENGINE = fused
dependency_groups =
  nbtest
  notebook-dependencies
commands_pre =
  python -I -m pip install --no-deps ./example/domain ./example/engine
commands =
  pytest --nbmake --nbmake-timeout=3000 {posargs} docs/

[testenv:ragged]
# Run the example domain's test suite against its pure-Python defaults. This
# suite activates a single domain one way per process, so it runs in-process
# (no --forked) and therefore also runs on platforms without os.fork().
dependency_groups =
  test
commands_pre =
  python -I -m pip install --no-deps ./example/domain
commands =
  pytest {posargs} example/domain/test/

[testenv:ragged-engine]
# Run the same suite with the "fused" engine auto-activated via the environment
# variable coheriq reads on first use.  The engine package must be installed so
# its entry point can be discovered.
dependency_groups =
  test
setenv =
  RAGGED_ENGINE = fused
commands_pre =
  python -I -m pip install --no-deps ./example/domain ./example/engine
commands =
  pytest {posargs} example/domain/test/

# Spelled out deliberately, for the reason given above the notebook env.
[testenv:{doctest,py310-doctest,py311-doctest,py312-doctest,py313-doctest,py314-doctest,py315-doctest}]
dependency_groups =
  test
  doctest
allowlist_externals =
  bash
commands =
  # Exit code 5 means "no tests collected"; the repo has no doctests yet, so
  # treat that as success while still failing on any actual doctest failure.
  bash -c 'pytest --forked --doctest-plus --doctest-only {posargs}; rc=$?; test $rc -eq 0 -o $rc -eq 5'

[testenv:coverage]
deps =
  coverage>=7.4.1
dependency_groups =
  test
  doctest
commands =
  pytest --forked --doctest-modules --cov=src --cov-report term-missing {posargs}
setenv =
  PYTHONPATH = {toxinidir}/test/coverage_startup

# Spelled out deliberately, for the reason given above the notebook env.
[testenv:{py-spawn,py310-spawn,py311-spawn,py312-spawn,py313-spawn,py314-spawn,py315-spawn}]
# Same unit tests as [testenv], but each test runs in a freshly *spawned*
# interpreter instead of a forked one.  The requirement is a process whose
# domain/engine registry is empty; a spawn satisfies that by construction, so
# this works on Windows, where --forked cannot run at all.
#
# Exploratory: the plugin lives in tools/, outside the package and outside
# testpaths, so it is never collected.  --forked remains the default.
dependency_groups =
  test
commands =
  pytest -p pytest_isolate_spawn --isolate {posargs}
setenv =
  # The plugin is imported by name; the parent needs its directory on the path.
  # The child gets it from the plugin itself, so this is the only place layout
  # is mentioned.
  PYTHONPATH = {toxinidir}{/}tools{/}spawn-isolation

# Spelled out deliberately, for the reason given above the notebook env.
[testenv:{coverage-spawn,py310-coverage-spawn,py311-coverage-spawn,py312-coverage-spawn,py313-coverage-spawn,py314-coverage-spawn,py315-coverage-spawn}]
# Coverage over the spawned-isolation suite.  Three things differ from the
# forked `coverage` env, and each one alone silently reports 0% on every file:
#
#   1. A spawned child does not inherit the parent's Coverage object, so it has
#      to start its own.  COVERAGE_PROCESS_START plus the sitecustomize in
#      tools/spawn-isolation/_covstart does that; the plugin passes both to the
#      child.  `parallel = true` keeps the children from truncating each other.
#   2. pytest-cov in the *parent* erases what the children wrote, hence
#      --no-cov here and a separate `coverage combine` below.
#   3. source = ["src"] measures nothing, because tox installs a wheel and the
#      child imports coheriq from site-packages.  coverage-spawn.toml uses
#      source_pkgs instead and maps site-packages back onto src/ for reporting.
deps =
  coverage>=7.4.1
dependency_groups =
  test
  doctest
commands =
  # No `bash -c`: these must run on Windows too, so each step is its own
  # command and tox stops on the first failure.
  coverage erase --rcfile={toxinidir}{/}tools{/}spawn-isolation{/}coverage-spawn.toml
  pytest -p pytest_isolate_spawn --isolate --no-cov {posargs}
  coverage combine --rcfile={toxinidir}{/}tools{/}spawn-isolation{/}coverage-spawn.toml
  coverage report --rcfile={toxinidir}{/}tools{/}spawn-isolation{/}coverage-spawn.toml
setenv =
  PYTHONPATH = {toxinidir}{/}tools{/}spawn-isolation
  # Tells the spawned children to start their own coverage.  The plugin passes
  # this through and adds the sitecustomize that acts on it.  Set explicitly
  # rather than autodetected, because the parent runs --no-cov and so has no
  # Coverage object for the plugin to notice.
  COVERAGE_PROCESS_START = {toxinidir}{/}tools{/}spawn-isolation{/}coverage-spawn.toml

[testenv:docs]
dependency_groups =
  docs
commands =
  sphinx-build -j auto -W -T --keep-going -b html {posargs} {toxinidir}/docs/ {toxinidir}/docs/_build/html
passenv =
  CI
  GITHUB_BASE_REF
  GITHUB_REF_NAME

[testenv:docs-clean]
skip_install = true
allowlist_externals =
  rm
commands =
  rm -rf {toxinidir}/docs/stubs/ {toxinidir}/docs/_build/
