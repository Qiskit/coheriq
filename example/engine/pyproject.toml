[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "coheriq_ragged_engine"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["coheriq", "coheriq_ragged_domain"]

[project.entry-points.'coheriq.engines.ragged']
fused = 'coheriq_ragged_engine._overrides'

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.wheel]
packages = ["src/coheriq_ragged_engine"]
