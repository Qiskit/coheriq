[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "coheriq"
version = "0.0.0"
readme = "README.md"
description = "Dispatch decorator framework"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]

requires-python = ">=3.10"

dependencies = [
]

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "doctest"},
    {include-group = "nbtest"},
    {include-group = "lint"},
    {include-group = "docs"},
    "tox>=4.4.3",
]
basetest = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-forked>=1.4.0",
]
test = [
    {include-group = "basetest"},
]
doctest = [
    {include-group = "basetest"},
    {include-group = "notebook-dependencies"},
    "pytest-doctestplus>=1.3.0",
]
nbtest = [
    {include-group = "basetest"},
    "nbmake>=1.5.0",
]
style = [
    "ruff==0.15.8",
    "nbqa>=1.8.5",
]
lint = [
    {include-group = "style"},
    "pylint==4.0.5",
    "mypy==1.20.0",
    "reno>=4.1",
]
notebook-dependencies = [
]
docs = [
    {include-group = "doctest"},
    "qiskit-sphinx-theme~=2.0.0",
    "jupyter-sphinx",
    "sphinx-design",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx_reredirects",
    "nbsphinx>=0.9.4",
    "reno>=4.1",
]

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/coheriq",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
python_version = "3.10"
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.10"
load-plugins = [
    "pylint.extensions.no_self_use",
]

[tool.pylint."messages control"]
disable = ["all"]
enable = [
    "reimported",
    "no-self-use",
    "no-else-raise",
    "redefined-argument-from-local",
    "redefined-builtin",
    "raise-missing-from",
    "cyclic-import",
    "unused-argument",
    "attribute-defined-outside-init",
    "no-else-return",
]

[tool.pytest.ini_options]
testpaths = ["./src/", "./test/"]
addopts = "--forked"

[tool.ruff]
line-length = 100
src = ["coheriq", "test"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "I",   # isort
    "E",   # pycodestyle
    "W",   # pycodestyle
    "D",   # pydocstyle
    "F",   # pyflakes
    "RUF", # ruff
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
]
ignore = [
    "E501", # line too long
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.extend-per-file-ignores]
"test/**.py" = [
    "D",    # pydocstyle
]
"docs/**" = [
    "E402", # module level import not at top of file
    "D100", # missing docstring in public module
    "D103", # missing docstring in public function
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = """\
# This code is a Qiskit project.
#
# \\(C\\) Copyright IBM \\d{4}((,\\s)\\d{4})*\\.
#
# This code is licensed under the Apache License, Version 2\\.0\\. You may
# obtain a copy of this license in the LICENSE\\.txt file in the root directory
# of this source tree or at http\\:\\/\\/www\\.apache\\.org\\/licenses\\/LICENSE\\-2\\.0\\.
#
# Any modifications or derivative works of this code must retain this
# copyright notice, and modified files need to carry a notice indicating
# that they have been altered from the originals\\.
"""

[tool.ruff.lint.pydocstyle]
convention = "google"
