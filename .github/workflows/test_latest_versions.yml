name: Tests

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'
  merge_group:
  schedule:
    - cron: '0 1 * * *'

jobs:
  tests:
    name: latest version tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      max-parallel: 4
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        toxenv: ["py,notebook,doctest"]
        include:
          - os: macos-latest
            python-version: "3.14"
            toxenv: "py,notebook,doctest"
          # The py and doctest envs use `pytest --forked`, which needs os.fork()
          # and cannot run on Windows. These envs run in-process, so they
          # exercise real dispatch (and the notebooks) on Windows.
          - os: windows-latest
            python-version: "3.14"
            toxenv: "notebook,ragged,ragged-engine"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Test using tox environment
        shell: bash
        run: |
          tox -e ${{ matrix.toxenv }} --parallel --parallel-no-spinner
