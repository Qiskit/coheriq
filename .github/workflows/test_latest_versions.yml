name: Tests

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'
  merge_group:
  schedule:
    - cron: '0 1 * * *'

jobs:
  tests:
    name: latest version tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      max-parallel: 4
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        toxenv: ["py,notebook,doctest,ragged,ragged-engine"]
        include:
          # One job per operating system per architecture, so the platform
          # support claim in README.md covers both architectures everywhere.
          - os: ubuntu-24.04-arm
            python-version: "3.15"
            toxenv: "py,notebook,doctest,ragged,ragged-engine"
          # macos-latest is ARM; macos-15-intel is the x86_64 counterpart.
          - os: macos-latest
            python-version: "3.15"
            toxenv: "py,notebook,doctest,ragged,ragged-engine"
          - os: macos-15-intel
            python-version: "3.15"
            toxenv: "py,notebook,doctest,ragged,ragged-engine"
          # The py and doctest envs use `pytest --forked`, which needs os.fork()
          # and cannot run on Windows. The spawn envs give the same per-test
          # isolation by starting a fresh interpreter instead, so Windows does
          # get the registry-dependent unit tests and their coverage; the rest
          # run in-process.
          - os: windows-latest
            python-version: "3.15"
            toxenv: "py-spawn,coverage-spawn,notebook,ragged,ragged-engine"
          - os: windows-11-arm
            python-version: "3.15"
            toxenv: "py-spawn,coverage-spawn,notebook,ragged,ragged-engine"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Test using tox environment
        shell: bash
        run: |
          tox -e ${{ matrix.toxenv }}
